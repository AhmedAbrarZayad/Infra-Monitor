
name: Infra-Monitor-AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret provided, skipping secure signing setup."
          fi

      - name: 🏗️ Build APKs
        env:
          KEYSTORE_PATH: "upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/

      # ─────────────── ONLY ON TAGS ───────────────
      - name: 🏷️ Create or update Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag:       ${{ github.ref_name }}
          name:      Release ${{ github.ref_name }}
          artifacts: artifacts/*.apk
          token:     ${{ secrets.GITHUB_TOKEN }}
          # Update the release if it already exists (e.g. on a re-run),
          # replacing the APKs but keeping its name, notes and flags.
          allowUpdates:               true
          omitNameDuringUpdate:       true
          omitBodyDuringUpdate:       true
          omitDraftDuringUpdate:      true
          omitPrereleaseDuringUpdate: true
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: ai-infra-monitor
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U monitor -d ai-infra-monitor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG: ${{ vars.DEBUG }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}

      GMAIL_SENDER_EMAIL: ${{ vars.GMAIL_SENDER_EMAIL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${{ vars.JWT_ACCESS_TOKEN_LIFETIME_MINUTES }}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${{ vars.JWT_REFRESH_TOKEN_LIFETIME_DAYS }}

      FRONTEND_WEB_URL: "http://localhost:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000"

      OTP_EXPIRY_MINUTES: ${{ vars.OTP_EXPIRY_MINUTES }}

      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: ai-infra-monitor
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_CONN_MAX_AGE: "0"

      # Monitoring configuration
      MONITORING_ENROLLMENT_EXPIRY_MINUTES: "15"
      MONITORING_CREDENTIAL_OVERLAP_MINUTES: "15"
      MONITORING_REMOTE_WRITE_MAX_COMPRESSED_BYTES: "10485760"
      MONITORING_REMOTE_WRITE_MAX_DECOMPRESSED_BYTES: "104857600"

      # External integrations disabled or mocked for backend CI
      FCM_ENABLED: "false"

      # ML configuration
      ML_SERVICE_TOKEN: ${{ secrets.ML_SERVICE_TOKEN }}
      ML_REQUEST_TIMEOUT_SECONDS: "30"
      ML_TRAINING_LOOKBACK_HOURS: "24"
      ML_INFERENCE_WINDOW_SECONDS: "300"
      ML_METRIC_STEP_SECONDS: "60"
      ML_ORCHESTRATION_INTERVAL_SECONDS: "300"

      # Gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_REQUEST_TIMEOUT_SECONDS: "60"

      ASSISTANT_WS_TICKET_TTL_SECONDS: "60"

      # Redis
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

      - name: Check migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test
