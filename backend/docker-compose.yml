services:
  backend:
    build: 
      context: .
    ports:
      - 7000:8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      vminsert:
        condition: service_healthy
    volumes:
      - .:/app

  
  postgres:
    image: postgres:18
    container_name: infra-monitor-database
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vmstorage:
    image: victoriametrics/vmstorage:v1.150.0-cluster
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=12
    volumes:
      - victoriametrics-data:/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8482/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  vminsert:
    image: victoriametrics/vminsert:v1.150.0-cluster
    restart: unless-stopped
    command:
      - -storageNode=vmstorage:8400
      - -enableMultitenancyViaHeaders=false
    depends_on:
      vmstorage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8480/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  vmselect:
    image: victoriametrics/vmselect:v1.150.0-cluster
    restart: unless-stopped
    command:
      - -storageNode=vmstorage:8401
      - -enableMultitenancyViaHeaders=false
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "8481:8481"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8481/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  


  



volumes:
  postgres-data: 
  victoriametrics-data:
